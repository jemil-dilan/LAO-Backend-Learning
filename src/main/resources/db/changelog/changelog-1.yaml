databaseChangeLog:
  - changeSet:
      id: 1
      author: jemil-dilan
      preConditions:
        - onFail: MARK_RAN
          not:
            tableExists:
              tableName: users
      changes:
        - createTable:
            tableName: users
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: first_name
                  type: varchar(250)
                  constraints:
                    nullable: false
              - column:
                  name: last_name
                  type: varchar(250)
                  constraints:
                    nullable: false
              - column:
                  name: user_email
                  type: varchar(250)
                  constraints:
                    unique: true
                    nullable: false
              - column:
                  name: creation_date
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
              - column:
                  name: last_updated_date
                  type: TIMESTAMP
                  constraints:
                    nullable: true
        - createIndex:
            tableName: users
            indexName: idx_users_email
            columns:
              - column:
                  name: user_email
  - changeSet:
      id: 2
      author: jemil-dilan
      changes:
        - insert:
            tableName: users
            columns:
              - column:
                  name: first_name
                  value: "John"
              - column:
                  name: last_name
                  value: "Doe"
              - column:
                  name: user_email
                  value: "johnDoe@sample.com"
              - column:
                  name: last_updated_date
                  valueDate: "2025-07-01T00:00:00"
